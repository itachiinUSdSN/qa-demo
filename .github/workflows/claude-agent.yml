name: Claude agent

# Runs Claude Code headless as one of the agents in .github/qa-agents/ and opens a PR.
#   issue labelled needs-tests -> Test Author writes tests for the acceptance criteria
#   issue labelled bug         -> Test Author writes the smallest failing repro (no fix)
#   issue labelled load-test   -> Load Test Author writes k6 scripts under tests/load/
#   dispatch agent=healer      -> Healer fixes locators in one failing test (sent by n8n)
#   dispatch agent=test-author -> Test Author for a Jira ticket (sent by n8n W2): branch
#                                 <KEY>-tests-<slug> / <KEY>-repro-<slug>, PR title starts with the key
# The agent may only write under tests/ (enforced by its tool rules and re-checked below).
# Its PRs carry the label qa-agent; qa-auto-merge.yml merges Healer PRs when green and test-only and holds the rest.
# PRs are pushed with QA_BOT_TOKEN, not GITHUB_TOKEN: pushes made with GITHUB_TOKEN
# do not trigger other workflows, so test.yml and healer-guard.yml would never run.
# The agent runs code it wrote (pytest, playwright), so job "agent" holds no write token: a
# read-only GITHUB_TOKEN and no saved git credentials. It hands its changes over as a patch;
# job "publish" checks the patch on a fresh runner, never runs agent code, and uses QA_BOT_TOKEN only
# in its "Open the PR" step.

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      agent:
        description: "healer or test-author"
        default: healer
      test_file:
        description: "Healer: failing test file, e.g. tests/e2e/login.spec.ts"
      failures:
        description: "Healer: failing test names and error lines"
      mode:
        description: "Test Author: story or bug"
      jira_key:
        description: "Test Author: Jira ticket key, e.g. QA-12"
      jira_url:
        description: "Test Author: link to the Jira ticket"
      issue_title:
        description: "Test Author: ticket summary"
      issue_body:
        description: "Test Author: ticket description"

permissions:
  contents: read

jobs:
  agent:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'needs-tests' || github.event.label.name == 'bug' || github.event.label.name == 'load-test'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Explicit shell: bash adds pipefail. The default (bash -e) does not, so
    # "runner | tee log" would report a failed suite as passed.
    defaults:
      run:
        shell: bash
    outputs:
      agent: ${{ steps.task.outputs.agent }}
      branch: ${{ steps.task.outputs.branch }}
      title: ${{ steps.task.outputs.title }}
      jira_url: ${{ steps.task.outputs.jira_url }}
    env:
      STAGING_URL: ${{ vars.STAGING_URL }}
      STAGING_API_URL: ${{ vars.STAGING_API_URL || vars.STAGING_URL }}
      MAX_TURNS: "40"
      MODEL: claude-sonnet-5-5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Claude Code and test runners
        run: |
          # Exact versions from .github/qa-agents/ (Dependabot keeps them current).
          npm install -g "@anthropic-ai/claude-code@$(jq -r '.dependencies["@anthropic-ai/claude-code"]' .github/qa-agents/package.json)"
          pip install -c .github/qa-agents/requirements.txt pytest httpx
          npm install --no-save "@playwright/test@$(jq -r '.dependencies["@playwright/test"]' .github/qa-agents/package.json)" "@axe-core/playwright@$(jq -r '.dependencies["@axe-core/playwright"]' .github/qa-agents/package.json)"
          npx playwright install --with-deps chromium

      # Untrusted text (issue title/body, failure log) only ever reaches the
      # script through env vars, never through ${{ }} inside run:.
      - name: Build the task
        id: task
        env:
          EVENT: ${{ github.event_name }}
          LABEL: ${{ github.event.label.name }}
          ISSUE: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          TEST_FILE: ${{ inputs.test_file }}
          FAILURES: ${{ inputs.failures }}
          RUN_ID: ${{ github.run_id }}
          AGENT_IN: ${{ inputs.agent }}
          MODE: ${{ inputs.mode }}
          JIRA_KEY: ${{ inputs.jira_key }}
          JIRA_URL: ${{ inputs.jira_url }}
          JIRA_TITLE: ${{ inputs.issue_title }}
          JIRA_BODY: ${{ inputs.issue_body }}
        run: |
          mkdir -p .qa && echo ".qa/" >> .git/info/exclude
          if [ "$EVENT" = workflow_dispatch ] && [ "$AGENT_IN" = test-author ]; then
            [[ "$JIRA_KEY" =~ ^[A-Z][A-Z0-9]+-[0-9]+$ ]] || { echo "::error::jira_key must look like QA-12"; exit 1; }
            case "$MODE" in story|bug) ;; *) echo "::error::mode must be story or bug"; exit 1;; esac
            case "$JIRA_URL" in https://*) ;; *) echo "::error::jira_url must be https"; exit 1;; esac
            slug=$(printf '%s' "$JIRA_TITLE" | tr '[:upper:]' '[:lower:]' | tr -cs 'a-z0-9' '-' | sed 's/^-//; s/-$//' | cut -c1-40 | sed 's/-$//')
            prefix=tests; title="$JIRA_KEY tests: $JIRA_TITLE"
            if [ "$MODE" = bug ]; then prefix=repro; title="$JIRA_KEY repro: $JIRA_TITLE"; fi
            printf 'Mode: %s\n\nJira %s: %s\n\n%s\n' "$MODE" "$JIRA_KEY" "$JIRA_TITLE" "$JIRA_BODY" > .qa/task.md
            { echo "agent=test-author"; echo "branch=$JIRA_KEY-$prefix-${slug:-ticket}"; echo "title=$title"; echo "jira_url=$JIRA_URL"; } >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = workflow_dispatch ]; then
            case "$TEST_FILE" in tests/*) ;; *) echo "::error::test_file must be under tests/"; exit 1;; esac
            printf 'Failing test file: %s\n\nFailures:\n%s\n' "$TEST_FILE" "$FAILURES" > .qa/task.md
            { echo "agent=healer"; echo "branch=qa/healer-$RUN_ID"; echo "title=heal: $TEST_FILE"; } >> "$GITHUB_OUTPUT"
          elif [ "$LABEL" = load-test ]; then
            printf 'Issue #%s: %s\n\n%s\n' "$ISSUE" "$ISSUE_TITLE" "$ISSUE_BODY" > .qa/task.md
            { echo "agent=load-tester"; echo "branch=qa/load-issue-$ISSUE"; echo "title=load: $ISSUE_TITLE (#$ISSUE)"; } >> "$GITHUB_OUTPUT"
          else
            mode=story; prefix=tests; title="tests: $ISSUE_TITLE (#$ISSUE)"
            if [ "$LABEL" = bug ]; then mode=bug; prefix=repro; title="repro: #$ISSUE $ISSUE_TITLE"; fi
            printf 'Mode: %s\n\nIssue #%s: %s\n\n%s\n' "$mode" "$ISSUE" "$ISSUE_TITLE" "$ISSUE_BODY" > .qa/task.md
            { echo "agent=test-author"; echo "branch=qa/$prefix-issue-$ISSUE"; echo "title=$title"; } >> "$GITHUB_OUTPUT"
          fi

      - name: Set up k6
        if: steps.task.outputs.agent == 'load-tester'
        uses: grafana/setup-k6-action@43b9fc21641a76002687994433dd586f56e791b1 # v1.2.2

      # Tests the agent writes and runs can sign in as staging QA users (tokens only).
      - name: Sign in QA users
        if: steps.task.outputs.agent != 'load-tester'
        env:
          QA_USERS: ${{ secrets.QA_USERS }}
          QA_OWNER: ${{ secrets.QA_OWNER }}
        run: python3 .github/qa-agents/qa-sign-in.py

      - name: Run the agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AGENT: ${{ steps.task.outputs.agent }}
          TEST_FILE: ${{ inputs.test_file }}
        run: |
          # --setting-sources local: ignore any .claude/settings.json in the repo,
          # so nothing can widen the tool rules below. Edit(path) rules also cover writing new files.
          case "$AGENT" in
            healer) edit=("Edit($TEST_FILE)");;
            load-tester) edit=("Edit(tests/load/**)" "Bash(.github/qa-agents/k6-smoke.sh *)");;
            *) edit=("Edit(tests/**)");;
          esac
          claude -p "$(cat .qa/task.md)" \
            --model "$MODEL" --max-turns "$MAX_TURNS" \
            --permission-mode default --setting-sources local \
            --append-system-prompt-file ".github/qa-agents/$AGENT.md" \
            --allowedTools Read Glob Grep "Edit(.qa/**)" "${edit[@]}" \
              "Bash(pytest *)" "Bash(npx playwright test *)" \
            | tee .qa/agent.log

      # Whatever the agent's code did to this runner, only this patch leaves it.
      - name: Hand over the changes
        run: |
          git add -A
          git diff --cached --binary > .qa/changes.patch
          git diff --cached --stat

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: agent-output
          path: |
            .qa/changes.patch
            .qa/pr-body.md
            .qa/agent.log
          if-no-files-found: ignore

  publish:
    needs: agent
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agent-output
          path: .qa

      - name: Apply the agent's patch
        run: |
          echo ".qa/" >> .git/info/exclude
          if [ -s .qa/changes.patch ]; then git apply --index .qa/changes.patch; fi

      - name: Check what the agent changed
        id: diff
        env:
          AGENT: ${{ needs.agent.outputs.agent }}
          TEST_FILE: ${{ inputs.test_file }}
        run: |
          changed=$(git diff --cached --name-only)
          echo "$changed"
          outside=$(echo "$changed" | grep -v '^tests/' || true)
          if [ -n "$outside" ]; then
            echo "::error::Agent changed files outside tests/: $outside"; exit 1
          fi
          others=$(echo "$changed" | grep -vxF "$TEST_FILE" || true)
          if [ "$AGENT" = healer ] && [ -n "$others" ]; then
            echo "::error::Healer changed a file other than $TEST_FILE: $others"; exit 1
          fi
          notload=$(echo "$changed" | grep -v '^tests/load/' || true)
          if [ "$AGENT" = load-tester ] && [ -n "$notload" ]; then
            echo "::error::Load Test Author changed files outside tests/load/: $notload"; exit 1
          fi
          echo "any=$([ -n "$changed" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
          [ -s .qa/pr-body.md ] || echo "(The agent did not write a summary; see the run log.)" > .qa/pr-body.md
          cat .qa/pr-body.md >> "$GITHUB_STEP_SUMMARY"

      # Without this, an agent that stopped to ask a question ends as a silent green run.
      - name: Explain on the issue why there is no PR
        if: steps.diff.outputs.any == 'no' && github.event.issue.number
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          { echo "The agent made no changes, so there is no PR. Its last words:"; echo; tail -c 3000 .qa/agent.log; echo; echo "Agent run: $RUN_URL"; } > .qa/comment.md
          gh issue comment "$ISSUE" --body-file .qa/comment.md

      - name: Open the PR
        if: steps.diff.outputs.any == 'yes'
        env:
          GH_TOKEN: ${{ secrets.QA_BOT_TOKEN }}
          BRANCH: ${{ needs.agent.outputs.branch }}
          TITLE: ${{ needs.agent.outputs.title }}
          ISSUE: ${{ github.event.issue.number }}
          JIRA_URL: ${{ needs.agent.outputs.jira_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          git config user.name "qa-agent"
          git config user.email "qa-agent@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add tests
          git commit -m "$TITLE"
          # The only place QA_BOT_TOKEN is used; the push URL is set here, never saved in .git/config.
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$BRANCH"
          { cat .qa/pr-body.md; echo; [ -n "$ISSUE" ] && echo "Refs #$ISSUE"; [ -n "$JIRA_URL" ] && echo "Jira: $JIRA_URL"; echo "Agent run: $RUN_URL"; } > .qa/body.md
          gh pr create --head "$BRANCH" --title "$TITLE" --body-file .qa/body.md --label qa-agent
