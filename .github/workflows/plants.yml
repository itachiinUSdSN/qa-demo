name: Plants (Part B check)
# Throwaway: r2test2's Part B CHECK against plants/app.py, started on this runner only (never deployed).
#   ZAP baseline (passive)  -> W1 security path, tool zap-plants, where "(plants)" (kept apart from the Pages scan)
#   pytest tests/plants     -> W1 test path, suite plants (a failing test is triaged and filed like any other)
# Delete with plants/ and tests/plants/ after the check.

on:
  workflow_dispatch:
    inputs:
      post:
        description: "Send results to n8n (false = dry run)"
        default: "true"
  push:
    branches: [main]
    paths: ["plants/**", "tests/plants/**", ".github/workflows/plants.yml"]
  pull_request:   # dry run on the PR: nothing is posted
    paths: ["plants/**", "tests/plants/**", ".github/workflows/plants.yml"]

permissions:
  contents: read

concurrency:
  group: plants
  cancel-in-progress: false

env:
  ZAP_IMAGE: ghcr.io/zaproxy/zaproxy@sha256:9624669db72f54d86c4b46a7064518bd9bf79d8c61a4c31befa9923489f328af # 2.17.0

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Start the plants app
        run: |
          mkdir -p results/security && chmod 777 results/security && date +%s > results/started
          nohup python3 plants/app.py 8000 >/dev/null 2>&1 &
          for i in $(seq 20); do curl -fsS -o /dev/null http://127.0.0.1:8000/ && exit 0; sleep 1; done; exit 1

      - name: ZAP baseline (passive)
        run: |
          docker run --rm --network host -v "$PWD/results/security:/zap/wrk:rw" "$ZAP_IMAGE" \
            zap-baseline.py -t http://127.0.0.1:8000/ -J zap.json -I -m 1 || true
          test -s results/security/zap.json

      - name: Plants tests
        id: tests
        continue-on-error: true
        run: |
          python3 -m pip install -q pytest==9.2.0
          set +e; python3 -m pytest tests/plants -q --junitxml=results/plants.xml 2>&1 | tee results/plants.log
          rc=${PIPESTATUS[0]}; [ "$rc" = 5 ] && rm -f results/plants.xml && rc=0   # 5 = no tests yet
          exit $rc

      - name: Report
        if: always()
        env:
          POST: ${{ github.event_name == 'pull_request' && 'false' || inputs.post || 'true' }}
          TESTS: ${{ steps.tests.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DIFF_URL: ${{ github.event.compare || format('{0}/{1}/commit/{2}', github.server_url, github.repository, github.sha) }}
          N8N_WEBHOOK_URL: ${{ secrets.N8N_WEBHOOK_URL }}
          N8N_WEBHOOK_TOKEN: ${{ secrets.N8N_WEBHOOK_TOKEN }}
        run: |
          python3 - <<'PY'
          import glob, json, os, time
          import xml.etree.ElementTree as ET
          base = {"repo": os.environ["GITHUB_REPOSITORY"], "branch": os.environ["GITHUB_REF_NAME"],
                  "commit_sha": os.environ["GITHUB_SHA"], "run_url": os.environ["RUN_URL"],
                  "artifact_url": os.environ["RUN_URL"], "reason": "plants"}
          RISK = {"3": "high", "2": "medium", "1": "low"}
          findings = []
          for site in json.load(open("results/security/zap.json")).get("site", []):
              for a in site.get("alerts", []):
                  if str(a.get("riskcode")) in RISK and str(a.get("pluginid")) != "10116":
                      findings.append({"tool": "zap-plants", "rule": str(a.get("pluginid")), "file": "(plants)", "line": None,
                                       "severity": RISK[str(a.get("riskcode"))],
                                       "title": f"{a.get('name')} ({a.get('count', len(a.get('instances', [])))} URLs)"[:200]})
          sec = {**base, "suite": "security", "scope": "plants", "status": "failure" if findings else "success",
                 "tools": {"zap-plants": "ok"}, "truncated": False, "total": len(findings), "findings": findings,
                 "counts": {s: sum(1 for f in findings if f["severity"] == s) for s in ("critical", "high", "medium", "low")}}
          json.dump(sec, open("results/security.json", "w"))
          print("ZAP:", [(f["rule"], f["severity"], f["title"]) for f in findings])
          if os.path.exists("results/plants.xml"):
              failed, passed = [], []
              for c in ET.parse("results/plants.xml").iter("testcase"):
                  name = f"{c.get('classname')}::{c.get('name')}"
                  (failed if c.find("failure") is not None or c.find("error") is not None else passed).append(name)
              tests = {**base, "suite": "plants", "status": "failure" if failed else "success", "failed_tests": failed,
                       "passed": len(passed), "passed_tests": passed, "diff_url": os.environ["DIFF_URL"],
                       "log_tail": open("results/plants.log").read()[-4000:],
                       "duration_s": int(time.time()) - int(open("results/started").read())}
              json.dump(tests, open("results/tests.json", "w"))
              print("tests: passed", passed, "failed", failed)
          PY
          if [ "$POST" = true ] && [ -n "$N8N_WEBHOOK_URL" ]; then
            for f in results/security.json results/tests.json; do
              [ -f "$f" ] || continue
              curl -fsS -X POST -H 'Content-Type: application/json' -H "X-QA-Token: $N8N_WEBHOOK_TOKEN" \
                --data @"$f" "$N8N_WEBHOOK_URL" -o /dev/null && echo "posted $f" || echo "::warning::could not post $f"
            done
          else
            echo "dry run: nothing posted"
          fi
