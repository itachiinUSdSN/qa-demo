name: QA coverage planner

# Started nightly by n8n W4. The Coverage Planner reads the code and the existing tests and
# proposes a few test stories; they are sent to n8n W9, which files them in Jira as needs-tests
# stories (W2 then starts the Test Author for each). Read-only: nothing is committed.

on:
  workflow_dispatch:
    inputs:
      max_stories:
        description: "At most this many stories"
        default: "3"
      planned:
        description: "Story keys already filed (comma-separated); do not propose these again"
        default: ""

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      MAX_TURNS: "30"
      MODEL: claude-sonnet-5-5
    steps:
      - uses: actions/checkout@v4

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Build the task
        env:
          MAX_STORIES: ${{ inputs.max_stories }}
          PLANNED: ${{ inputs.planned }}
        run: |
          [[ "$MAX_STORIES" =~ ^[0-9]+$ ]] && [ "$MAX_STORIES" -le 5 ] || { echo "::error::max_stories must be 0-5"; exit 1; }
          mkdir -p .qa && echo ".qa/" >> .git/info/exclude
          printf 'Propose at most %s stories.\n\nAlready planned (keys):\n%s\n' \
            "$MAX_STORIES" "$(printf '%s' "$PLANNED" | tr ',' '\n' | sed 's/^/- /')" > .qa/task.md

      - name: Run the planner
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # Read-only except its own output file; no shell commands.
          claude -p "$(cat .qa/task.md)" \
            --model "$MODEL" --max-turns "$MAX_TURNS" \
            --permission-mode default --setting-sources local \
            --append-system-prompt-file ".github/qa-agents/coverage-planner.md" \
            --allowedTools Read Glob Grep "Edit(.qa/**)" \
            | tee .qa/agent.log

      - name: Send stories to n8n
        env:
          MAX_STORIES: ${{ inputs.max_stories }}
          N8N_WEBHOOK_URL: ${{ secrets.N8N_WEBHOOK_URL }}
          N8N_WEBHOOK_TOKEN: ${{ secrets.N8N_WEBHOOK_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request
          stories = json.load(open(".qa/stories.json"))["stories"]
          ok = []
          for s in stories:
              acc = s.get("acceptance") or []
              if (re.fullmatch(r"[a-z0-9-]+(:[a-z0-9-]+){1,3}", str(s.get("key", "")))
                      and 0 < len(str(s.get("title", ""))) <= 120 and 2 <= len(acc) <= 5
                      and all(isinstance(a, str) and a.strip() for a in acc)):
                  ok.append({k: s.get(k) for k in ("key", "title", "role", "suite", "acceptance", "why")})
          ok = ok[: int(os.environ["MAX_STORIES"])]
          print(f"{len(ok)} valid of {len(stories)} proposed: " + ", ".join(s["key"] for s in ok))
          if not ok:
              raise SystemExit(0)
          url = os.environ["N8N_WEBHOOK_URL"].rsplit("/", 1)[0] + "/coverage-stories"
          body = json.dumps({"repo": os.environ["GITHUB_REPOSITORY"], "run_url": os.environ["RUN_URL"],
                             "stories": ok}).encode()
          req = urllib.request.Request(url, data=body, method="POST", headers={
              "Content-Type": "application/json", "X-QA-Token": os.environ["N8N_WEBHOOK_TOKEN"]})
          urllib.request.urlopen(req, timeout=30).read()
          PY
