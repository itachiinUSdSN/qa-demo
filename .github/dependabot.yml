# Keeps the qa-agents pins current: GitHub Actions (commit SHAs) and the npm/pip tools under
# .github/qa-agents/. Weekly; each update is a normal PR for a person to merge.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /.github/qa-agents
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /.github/qa-agents
    schedule:
      interval: weekly
